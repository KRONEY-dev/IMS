apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-inventory-db
  labels:
    {{- include "ims.componentLabels" (dict "context" $ "component" "inventory-db") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ims.selectorLabels" (dict "context" $ "component" "inventory-db") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "ims.selectorLabels" (dict "context" $ "component" "inventory-api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.inventoryDb.port }}
