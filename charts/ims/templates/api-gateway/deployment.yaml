apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api-gateway
  labels:
    {{- include "ims.componentLabels" (dict "context" $ "component" "api-gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "ims.selectorLabels" (dict "context" $ "component" "api-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ims.componentLabels" (dict "context" $ "component" "api-gateway") | nindent 8 }}
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag }}"
          imagePullPolicy: {{ .Values.apiGateway.image.pullPolicy }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: "https://+:{{ .Values.apiGateway.port }}"
            - name: Kestrel__Certificates__Default__Path
              value: /app/Certs/gateway.pfx
            - name: Kestrel__Certificates__Default__Password
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-api-gateway
                  key: cert-password
            - name: ConnectionStrings__Redis
              value: "{{ .Release.Name }}-redis:{{ .Values.redis.port }}"
            - name: ReverseProxy__Clusters__accounts-cluster__Destinations__destination1__Address
              value: "http://{{ .Release.Name }}-accounts-api:{{ .Values.accountsApi.port }}"
            - name: ReverseProxy__Clusters__inventory-cluster__Destinations__destination1__Address
              value: "http://{{ .Release.Name }}-inventory-api:{{ .Values.inventoryApi.port }}"
            - name: DocsAccessSettings__AllowedNetworks__0
              value: "127.0.0.1/32"
            - name: DocsAccessSettings__AllowedNetworks__1
              value: "::1/128"
          volumeMounts:
            - name: jwt-public-key
              mountPath: /app/Keys/accounts-public.pem
              subPath: accounts-public.pem
            - name: gateway-cert
              mountPath: /app/Certs/gateway.pfx
              subPath: gateway.pfx
          ports:
            - containerPort: {{ .Values.apiGateway.port }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.apiGateway.port }}
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.apiGateway.port }}
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: jwt-public-key
          secret:
            secretName: ims-jwt-keys
        - name: gateway-cert
          secret:
            secretName: ims-gateway-cert
