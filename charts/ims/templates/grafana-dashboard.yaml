apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-dashboard
  labels:
    grafana_dashboard: "1"
data:
  ims-http-overview.json: |
    {
      "uid": "ims-http-overview",
      "title": "IMS HTTP Overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_requests_received_total[5m])) by (job)",
              "legendFormat": "{{ "{{" }}job{{ "}}" }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "P95 Latency by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (job, le))",
              "legendFormat": "{{ "{{" }}job{{ "}}" }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Requests In Progress by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(http_requests_in_progress) by (job)",
              "legendFormat": "{{ "{{" }}job{{ "}}" }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Requests by Endpoint",
          "type": "table",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(http_requests_received_total) by (job, endpoint)",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ]
        }
      ]
    }
