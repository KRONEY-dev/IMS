{{- if .Values.backup.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    {{- include "ims.componentLabels" (dict "context" $ "component" "backup") | nindent 4 }}
type: Opaque
stringData:
  accessKey: {{ .Values.backup.accessKey | quote }}
  secretKey: {{ .Values.backup.secretKey | quote }}
{{- end }}
