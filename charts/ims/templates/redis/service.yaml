apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "ims.componentLabels" (dict "context" $ "component" "redis") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "ims.selectorLabels" (dict "context" $ "component" "redis") | nindent 4 }}
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
