apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-accounts-api
  labels:
    {{- include "ims.componentLabels" (dict "context" $ "component" "accounts-api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ims.selectorLabels" (dict "context" $ "component" "accounts-api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "ims.selectorLabels" (dict "context" $ "component" "api-gateway") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.accountsApi.port }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.accountsApi.port }}
