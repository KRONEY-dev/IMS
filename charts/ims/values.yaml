accountsDb:
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  database: accounts
  username: postgres
  port: 5432
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 400Mi

inventoryDb:
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  database: inventory
  username: postgres
  port: 5432
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 400Mi

rabbitmq:
  image:
    repository: rabbitmq
    tag: "4-management-alpine"
    pullPolicy: IfNotPresent
  amqpPort: 5672
  managementPort: 15672
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 300m
      memory: 150Mi
    limits:
      cpu: 600m
      memory: 300Mi

redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  port: 6379
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

accountsApi:
  image:
    repository: ims-accounts-api
    tag: latest
    pullPolicy: Never
  migrationImage:
    repository: ims-accounts-migrate
    tag: latest
    pullPolicy: Never
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 75m
      memory: 150Mi
    limits:
      cpu: 400m
      memory: 300Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

inventoryApi:
  image:
    repository: ims-inventory-api
    tag: latest
    pullPolicy: Never
  migrationImage:
    repository: ims-inventory-migrate
    tag: latest
    pullPolicy: Never
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 160Mi
    limits:
      cpu: 500m
      memory: 350Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

apiGateway:
  image:
    repository: ims-api-gateway
    tag: latest
    pullPolicy: Never
  replicaCount: 1
  port: 8081
  forwardedHeadersTrustedNetwork: "10.244.0.0/16"
  resources:
    requests:
      cpu: 150m
      memory: 110Mi
    limits:
      cpu: 800m
      memory: 250Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

ingress:
  host: ims.local

certManager:
  createSelfSignedCA: true
  issuerName: ims-ca-issuer
