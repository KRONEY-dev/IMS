# Copy this file to kube-prometheus-stack-values-secrets.yaml (gitignored) and fill in real values.
# Deploy with:
# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   --namespace monitoring -f charts/monitoring/kube-prometheus-stack-values-oracle.yaml \
#   -f charts/monitoring/kube-prometheus-stack-values-secrets.yaml
#
# Only overrides the pieces the chart default needs to actually send mail — the
# default route/receivers (including the Watchdog -> null routing) stay intact,
# since Helm merges maps key-by-key; only the "null" and "email" receivers are
# restated because a supplied receivers list replaces the default one wholesale.
alertmanager:
  config:
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: CHANGE_ME
      smtp_auth_username: CHANGE_ME
      smtp_auth_password: CHANGE_ME
      smtp_require_tls: true
    route:
      receiver: email
    receivers:
      - name: 'null'
      - name: email
        email_configs:
          - to: CHANGE_ME
