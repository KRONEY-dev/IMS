# Overlay applied on top of the kube-prometheus-stack chart defaults, for the
# Oracle Cloud deployment:
# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   --namespace monitoring -f charts/monitoring/kube-prometheus-stack-values-oracle.yaml
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false

kubeControllerManager:
  endpoints: ["10.0.0.197"]
kubeScheduler:
  endpoints: ["10.0.0.197"]
kubeProxy:
  endpoints: ["10.0.0.197"]
kubeEtcd:
  enabled: false

defaultRules:
  rules:
    etcd: false

grafana:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - ims-grafana.duckdns.org
    tls:
      - secretName: grafana-tls
        hosts:
          - ims-grafana.duckdns.org
  # Read-only public access for the portfolio demo: anyone with the URL sees the
  # dashboards without logging in, but can't edit anything or reach admin settings.
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer
