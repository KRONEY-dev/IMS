name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IMS.slnx

      - name: Build (entire solution)
        run: dotnet build IMS.slnx --no-restore --configuration Release

      - name: Test AccountsService
        run: >
          dotnet test AccountsService/AccountsService.Tests/AccountsService.Tests.csproj
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=accounts-tests.trx"
          --results-directory ./TestResults

      - name: Test InventoryService
        run: >
          dotnet test InventoryService/InventoryService.Tests/InventoryService.Tests.csproj
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=inventory-tests.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/

      - name: Restore local tools (dotnet-ef)
        run: dotnet tool restore

      - name: Check for model changes missing a migration (Accounts)
        run: >
          dotnet ef migrations has-pending-model-changes
          --project AccountsService/AccountsService.Infrastructure/AccountsService.Infrastructure.csproj
          --startup-project AccountsService/AccountsService.API/AccountsService.API.csproj

      - name: Check for model changes missing a migration (Inventory)
        run: >
          dotnet ef migrations has-pending-model-changes
          --project InventoryService/InventoryService.Infrastructure/InventoryService.Infrastructure.csproj
          --startup-project InventoryService/InventoryService.API/InventoryService.API.csproj

      - name: Generate reviewable migration SQL (Accounts)
        run: >
          dotnet ef migrations script --idempotent
          --project AccountsService/AccountsService.Infrastructure/AccountsService.Infrastructure.csproj
          --startup-project AccountsService/AccountsService.API/AccountsService.API.csproj
          --output ./MigrationScripts/accounts-migrations.sql

      - name: Generate reviewable migration SQL (Inventory)
        run: >
          dotnet ef migrations script --idempotent
          --project InventoryService/InventoryService.Infrastructure/InventoryService.Infrastructure.csproj
          --startup-project InventoryService/InventoryService.API/InventoryService.API.csproj
          --output ./MigrationScripts/inventory-migrations.sql

      - name: Upload migration SQL for review
        uses: actions/upload-artifact@v7
        with:
          name: migration-scripts
          path: MigrationScripts/

  migrate-check:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      accounts-db:
        image: postgres:17
        env:
          POSTGRES_DB: accounts
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d accounts"
          --health-interval=5s --health-timeout=5s --health-retries=5

      inventory-db:
        image: postgres:17
        env:
          POSTGRES_DB: inventory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d inventory"
          --health-interval=5s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IMS.slnx

      - name: Restore local tools (dotnet-ef)
        run: dotnet tool restore

      - name: Apply migrations to a fresh database (Accounts)
        run: >
          dotnet ef database update
          --project AccountsService/AccountsService.Infrastructure/AccountsService.Infrastructure.csproj
          --startup-project AccountsService/AccountsService.API/AccountsService.API.csproj
        env:
          ConnectionStrings__Accounts: "Host=localhost;Port=5432;Database=accounts;Username=postgres;Password=postgres"

      - name: Apply migrations to a fresh database (Inventory)
        run: >
          dotnet ef database update
          --project InventoryService/InventoryService.Infrastructure/InventoryService.Infrastructure.csproj
          --startup-project InventoryService/InventoryService.API/InventoryService.API.csproj
        env:
          ConnectionStrings__Inventory: "Host=localhost;Port=5433;Database=inventory;Username=postgres;Password=postgres"

  build-images:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ims-accounts-api
            dockerfile: AccountsService/AccountsService.API/Dockerfile
            target: ""
            cache-scope: accounts
          - image: ims-accounts-migrate
            dockerfile: AccountsService/AccountsService.API/Dockerfile
            target: migrator
            cache-scope: accounts
          - image: ims-inventory-api
            dockerfile: InventoryService/InventoryService.API/Dockerfile
            target: ""
            cache-scope: inventory
          - image: ims-inventory-migrate
            dockerfile: InventoryService/InventoryService.API/Dockerfile
            target: migrator
            cache-scope: inventory
          - image: ims-api-gateway
            dockerfile: ApiGateway/Dockerfile
            target: ""
            cache-scope: api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and cache ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/kroney-dev/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}-amd64

  helm-deploy-smoke-test:
    runs-on: ubuntu-latest
    needs: [build-and-test, build-images]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Install ServiceMonitor and cert-manager CRDs
        run: |
          kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.94.0/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml
          kubectl apply --server-side -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.crds.yaml
          kubectl create namespace cert-manager --dry-run=client -o yaml | kubectl apply -f -

      - name: Generate JWT signing keys for this run
        run: |
          mkdir -p AccountsService/AccountsService.API/Keys ApiGateway/Keys
          openssl genrsa -out AccountsService/AccountsService.API/Keys/accounts-private.pem 2048
          openssl rsa -in AccountsService/AccountsService.API/Keys/accounts-private.pem -pubout -out ApiGateway/Keys/accounts-public.pem

      - name: Pull pre-built images from this run
        run: |
          for img in ims-accounts-api ims-accounts-migrate ims-inventory-api ims-inventory-migrate ims-api-gateway; do
            docker pull ghcr.io/kroney-dev/$img:sha-${{ github.sha }}
            docker tag ghcr.io/kroney-dev/$img:sha-${{ github.sha }} $img:latest
          done

      - name: Load images into the kind cluster
        run: |
          kind load docker-image ims-accounts-api:latest ims-accounts-migrate:latest \
            ims-inventory-api:latest ims-inventory-migrate:latest ims-api-gateway:latest

      - name: Create JWT keys secret
        run: dotnet run scripts/k8s-create-jwt-secret.cs

      - name: Materialize chart secrets from GitHub Actions Secrets
        run: |
          cat <<EOF > charts/ims/values-secrets.yaml
          accountsDb:
            password: "${{ secrets.CI_ACCOUNTS_DB_PASSWORD }}"
          inventoryDb:
            password: "${{ secrets.CI_INVENTORY_DB_PASSWORD }}"
          EOF

      - name: Deploy the Helm chart
        run: helm upgrade --install ims charts/ims -f charts/ims/values-secrets.yaml --wait --timeout 5m

      - name: Show pod status
        if: always()
        run: kubectl get pods -o wide

      - name: Smoke test through the gateway
        run: |
          kubectl port-forward svc/ims-api-gateway 18081:8081 &
          sleep 5
          ready_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:18081/health/ready)
          login_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:18081/accounts/api/Auth/Login -H "Content-Type: application/json" -d "{}")
          echo "gateway ready: $ready_code"
          echo "accounts login: $login_code"
          test "$ready_code" = "200"
          test "$login_code" = "400"

      - name: Dump pod logs on failure
        if: failure()
        run: |
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/part-of=ims --all-containers --tail=200 || true

  build-and-push-images:
    runs-on: ${{ matrix.platform.runner }}
    needs: [migrate-check, helm-deploy-smoke-test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - name: ims-accounts-api
            dockerfile: AccountsService/AccountsService.API/Dockerfile
            target: ""
            cache-scope: accounts
          - name: ims-accounts-migrate
            dockerfile: AccountsService/AccountsService.API/Dockerfile
            target: migrator
            cache-scope: accounts
          - name: ims-inventory-api
            dockerfile: InventoryService/InventoryService.API/Dockerfile
            target: ""
            cache-scope: inventory
          - name: ims-inventory-migrate
            dockerfile: InventoryService/InventoryService.API/Dockerfile
            target: migrator
            cache-scope: inventory
          - name: ims-api-gateway
            dockerfile: ApiGateway/Dockerfile
            target: ""
            cache-scope: api-gateway
        platform:
          - id: amd64
            runner: ubuntu-latest
            docker-platform: linux/amd64
          - id: arm64
            runner: ubuntu-24.04-arm
            docker-platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }} (${{ matrix.platform.id }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform.docker-platform }}
          push: true
          tags: ghcr.io/kroney-dev/${{ matrix.image.name }}:latest-${{ matrix.platform.id }}
          cache-from: type=gha,scope=${{ matrix.image.cache-scope }}-${{ matrix.platform.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.cache-scope }}-${{ matrix.platform.id }}

  publish-multiarch-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [ims-accounts-api, ims-accounts-migrate, ims-inventory-api, ims-inventory-migrate, ims-api-gateway]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine amd64+arm64 into one manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/kroney-dev/${{ matrix.image }}:latest \
            ghcr.io/kroney-dev/${{ matrix.image }}:latest-amd64 \
            ghcr.io/kroney-dev/${{ matrix.image }}:latest-arm64

  deploy-to-oracle:
    runs-on: ubuntu-latest
    needs: publish-multiarch-manifests
    if: github.event_name == 'push'
    concurrency:
      group: deploy-to-oracle
      cancel-in-progress: false

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          echo "${{ secrets.ORACLE_HOST }} ${{ secrets.ORACLE_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Deploy to Oracle Cloud
        run: |
          ssh -i ~/.ssh/oracle_key ubuntu@${{ secrets.ORACLE_HOST }} '
            export KUBECONFIG=~/.kube/config
            cd ~/IMS
            git fetch origin
            git reset --hard origin/main
            helm upgrade --install ims charts/ims -f charts/ims/values-oracle.yaml -f charts/ims/values-secrets.yaml --wait --timeout 5m
          '

      - name: Verify the live deployment
        run: |
          ready_code=$(curl -s -o /dev/null -w "%{http_code}" https://ims-main.duckdns.org/health/ready)
          echo "production health: $ready_code"
          test "$ready_code" = "200"

      - name: Roll back on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/oracle_key ubuntu@${{ secrets.ORACLE_HOST }} '
            export KUBECONFIG=~/.kube/config
            helm rollback ims --wait --timeout 5m
          '
          sleep 5
          rollback_code=$(curl -s -o /dev/null -w "%{http_code}" https://ims-main.duckdns.org/health/ready)
          echo "post-rollback health: $rollback_code"
