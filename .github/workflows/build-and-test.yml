name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IMS.slnx

      - name: Build (entire solution)
        run: dotnet build IMS.slnx --no-restore --configuration Release

      - name: Test AccountsService
        run: >
          dotnet test AccountsService/AccountsService.Tests/AccountsService.Tests.csproj
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=accounts-tests.trx"
          --results-directory ./TestResults

      - name: Test InventoryService
        run: >
          dotnet test InventoryService/InventoryService.Tests/InventoryService.Tests.csproj
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=inventory-tests.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
